[package]
name = "ai-terminal"
version = "0.10.0"
description = "Code Whereabouts - See where AI works and what it changes"
authors = ["AI Terminal contributors"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ai_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# 파일 트리에서 Finder·다른 앱으로 실제 파일을 끌어 내보내기(맥 네이티브 드래그)
tauri-plugin-drag = "2.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
rusqlite = { version = "0.40", features = ["bundled"] }
notify = "8.2"
notify-debouncer-full = "0.7"
zstd = "0.13"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
parking_lot = "0.12"
libc = "0.2"
# 자동화 빌드에서만: 자기 창에 macOS 키 이벤트를 보내 실제 입력기(한글 조합)를 거치게 한다.
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "NSString", "NSGeometry", "NSArray", "NSNotification"] }
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = ["std", "NSEvent", "NSApplication", "NSWindow", "NSResponder", "NSGraphicsContext", "NSRunningApplication", "NSTextInputContext"] }
tauri-plugin-updater = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
semver = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
tempfile = "3"

[features]
# 테스트용 원격 조작 소켓. 배포 빌드에는 넣지 않는다.
automation = ["dep:objc2", "dep:objc2-foundation", "dep:objc2-app-kit"]


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
