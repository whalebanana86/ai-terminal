<!doctype html><html lang="ko"><head><meta charset="utf-8">
<!-- 소개 영상 타임라인(1920×1080). render(t) 가 t 초의 화면을 그린다 → render.mjs frames 가 프레임마다 찍는다. 장면 그림은 같은 폴더.
     영어판은 make_promo.sh 가 아래 LANG 을 "en" 으로 바꿔 복사한다 -->
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#07090d;font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;color:#eef1f5}
#bg{position:absolute;inset:0;background:radial-gradient(1200px 700px at 20% 0%,#16304a 0%,transparent 60%),radial-gradient(1000px 700px at 100% 100%,#2a1d3d 0%,transparent 55%),#07090d}
.brand{position:absolute;left:56px;top:40px;font-size:24px;font-weight:700;letter-spacing:-.2px;opacity:.9}
.brand small{font-weight:500;color:#8fa0b5;margin-left:10px;font-size:18px}
.scene{position:absolute;inset:0;opacity:0}
.cap{position:absolute;left:0;right:0;top:72px;text-align:center}
.cap h1{margin:0;font-size:64px;font-weight:800;letter-spacing:-1.5px;line-height:1.1}
.cap p{margin:14px 0 0;font-size:30px;color:#a9b6c8;font-weight:500}
.card{position:absolute;left:140px;top:262px;width:1640px;height:780px;border-radius:22px;overflow:hidden;background:#0b0d11;
  box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08)}
.card img{position:absolute;left:0;top:0;transform-origin:0 0}
.pair .card{width:760px;height:740px;top:300px;left:170px}
.pair .card.b{left:990px}
.tag{position:absolute;top:252px;font-size:26px;font-weight:700;color:#cfd8e3}
.wide .card{height:auto}
.big{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.big .name{font-size:132px;font-weight:900;letter-spacing:-4px;line-height:1}
.big .sub{font-size:38px;color:#a9b6c8;margin-top:22px;font-weight:600}
.chip{display:inline-block;margin-top:40px;padding:12px 28px;border-radius:40px;background:#1c3b57;color:#8fd3ff;font-size:30px;font-weight:700;border:1px solid #2e5f88}
.url{margin-top:34px;font-size:40px;font-weight:700;color:#e8eef6}
.big .buki{width:190px;height:152px;margin-bottom:34px}
.ok{color:#7ee787}
.note .cap{top:150px}
.handoff{position:absolute;left:0;right:0;top:420px;display:flex;justify-content:center;align-items:center;gap:56px}
.ver{width:620px;padding:34px 40px;border-radius:22px;background:#0f141b;box-shadow:0 0 0 1px rgba(255,255,255,.09),0 24px 60px rgba(0,0,0,.45)}
.ver h3{margin:0 0 22px;font-size:34px;color:#8fa0b5;font-weight:700}
.ver .row{display:flex;align-items:center;gap:18px;font-size:36px;margin:16px 0;font-family:ui-monospace,Menlo,monospace;color:#d6dde7}
.dot{width:16px;height:16px;border-radius:50%;background:#7ee787;box-shadow:0 0 14px #7ee78788}
.arrow{font-size:80px;color:#8fd3ff;font-weight:800}
.list ul{position:absolute;left:330px;right:200px;top:330px;margin:0;padding:0;list-style:none}
.list li{font-size:44px;font-weight:600;margin:0 0 34px;display:flex;gap:22px;align-items:baseline}
.list li b{color:#7ee787;font-size:40px}
.list li small{display:block;font-size:28px;color:#8fa0b5;font-weight:500;margin-top:8px}
</style></head><body>
<div id="bg"></div>
<div id="root"></div>
<script>
const CW = 1640, CH = 780;
// 영역은 앱 화면(1440×900) 기준 비율 [x, y, w, h]
const FULL = [0, 0, 1, 1];
const DURATION = 36;
const LANG = "ko";
const L = (ko, en) => (LANG === "en" ? en : ko);
document.documentElement.lang = LANG;
const NAME = L("코드행방", "Code Whereabouts");
const TAGLINE = L("AI가 어디서 무엇을 바꾸는지", "See where AI works and what it changes");
const S = [
  { t: [0, 2.6], kind: "title" },
  { t: [2.6, 8.6], img: "memory-start.png", h: L("긴 대화, 통째로 다시 보내지 마세요", "Stop resending the whole conversation"), s: L("최근 대화 + 필요한 지난 기록만 담아 새 세션으로 · 기억 담아 새로", "Fresh with memory: recent turns + only the past work you need, in a new session"), from: FULL, to: [0.31, 0.355, 0.38, 0.29] },
  { t: [8.6, 12.8], img: "memory-preview.png", h: L("넣을 글은 미리 보고 골라요", "Preview what goes in, then pick"), s: L("Claude 는 시작할 때 컨텍스트로 · Codex 는 첫 메시지로", "Claude gets it as startup context · Codex as the first message"), from: [0.3, 0.05, 0.4, 0.9], to: [0.315, 0.645, 0.37, 0.28] },
  { t: [12.8, 16.8], img: "memory-settings.png", h: L("지난 작업을 이 맥 안에 기억", "Remembers past work, on your Mac"), s: L("작업 기억 · 뜻으로 찾기 · 비밀값은 가리고 밖으로 안 보내요", "Work memory · search by meaning · secrets masked, nothing leaves your Mac"), from: [0.34, 0.17, 0.32, 0.66], to: [0.35, 0.595, 0.3, 0.215] },
  { t: [16.8, 20.6], kind: "note", h: L("업데이트해도 AI 가 안 끊겨요", "Updates don't cut off your AI"), s: L("돌던 터미널을 새 버전이 그대로 이어받아요", "The new version takes over the running terminals as they are") },
  { t: [20.6, 25.0], kind: "pair", a: "graph.png", b: "branches.png", la: L("그래프", "Graph"), lb: L("브랜치 탭", "Branches tab"), h: L("브랜치 색이 어디서나 같아요", "Same branch colors everywhere"), s: L("그래프의 노선 색 그대로 · 원격 브랜치는 테두리만", "The graph's line colors carry over · remote branches get an outline"), region: [0, 0.18, 0.33, 0.52] },
  { t: [25.0, 29.4], img: "trust.png", h: L("남이 준 저장소도 안심하고 열기", "Open other people's repos safely"), s: L("Git 설정 속 실행 명령(훅·필터)은 믿기 전엔 꺼 둬요", "Commands in Git config (hooks, filters) stay off until you trust the repo"), from: FULL, to: [0.325, 0.345, 0.35, 0.31] },
  { t: [29.4, 33.4], kind: "list", h: L("그 밖에도", "Also new"),
    items: [
      [L("터미널의 파일 경로를 누르면 바로 열기", "Click a file path in the terminal to open it"), L("src/lib/sort.ts:12 처럼 줄 번호까지", "Line numbers too, like src/lib/sort.ts:12")],
      [L("파일 트리 끌어다 놓기", "Drag and drop in the file tree"), L("Finder ↔ 트리 ↔ 터미널 입력칸", "Finder ↔ tree ↔ terminal input")],
      [L("쉬는 동안 CPU 거의 0%", "Near-0% CPU when idle"), L("세션이 많아도 메모리를 덜 써요", "Less memory, even with many sessions")],
      [L("저장소마다 따로 보이는 파일 탭", "File tabs per repository"), L("설정 → 오픈소스 라이선스도 새로", "Plus Settings → Open source licenses")],
    ] },
  { t: [33.4, 36], kind: "outro" },
];
const FADE = 0.35;
const ease = (x) => (x < 0 ? 0 : x > 1 ? 1 : x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const lerp = (a, b, k) => a + (b - a) * k;
const root = document.getElementById("root");
let pending = 0;
const brand = `<div class="brand">${NAME}<small>${TAGLINE}</small></div>`;

function place(img, region, iw, ih, cw = CW, ch = CH) {
  const [x, y, w, h] = region;
  const rw = w * iw, rh = h * ih;
  const sc = Math.min(cw / rw, ch / rh);
  let tx = cw / 2 - (x * iw + rw / 2) * sc;
  let ty = ch / 2 - (y * ih + rh / 2) * sc;
  // 그림이 칸보다 크면 가장자리가 비어 보이지 않게, 작으면 가운데로
  tx = iw * sc >= cw ? Math.min(0, Math.max(cw - iw * sc, tx)) : (cw - iw * sc) / 2;
  ty = ih * sc >= ch ? Math.min(0, Math.max(ch - ih * sc, ty)) : (ch - ih * sc) / 2;
  img.style.transform = `translate(${tx}px, ${ty}px) scale(${sc})`;
}
function loadImg(src) {
  const img = new Image();
  pending++;
  img.onload = () => --pending === 0 && (window.ready = true);
  img.src = src;
  return img;
}
for (const sc of S) {
  const el = document.createElement("section");
  el.className = "scene" + (sc.kind === "pair" ? " pair" : sc.kind === "note" ? " note" : sc.kind === "list" ? " list" : "");
  if (sc.kind === "title") {
    el.innerHTML = `<div class="big"><div class="name">${NAME}</div><div class="sub">${L("AI가 어디서 무엇을 바꾸는지 한눈에", "See where AI works and what it changes")}</div><div class="chip">${L("새로 들어온 기능", "What's new")} · v0.8 → v0.11</div></div>`;
  } else if (sc.kind === "outro") {
    el.innerHTML = `<div class="big"><div class="name">${NAME}</div><div class="sub">${L("Claude Code · Codex 를 여러 개 돌릴 때 쓰는 macOS 앱", "A macOS app for running many Claude Code & Codex sessions")}</div><div class="sub"><span class="ok">${L("무료 · 오픈소스(MIT)", "Free · Open source (MIT)")}</span> · ${L("앱 안에서 자동 업데이트", "Updates itself in the app")}</div><div class="url">github.com/whalebanana86/ai-terminal</div></div>`;
  } else if (sc.kind === "note") {
    const row = (name) => `<div class="row"><span class="dot"></span>${name}</div>`;
    const rows = row(L("claude · 로그인 화면", "claude · login screen")) + row(L("codex · 다크 모드", "codex · dark mode")) + row(L("claude · 정렬 버그", "claude · sort bug"));
    el.innerHTML = brand + `<div class="cap"><h1>${sc.h}</h1><p>${sc.s}</p></div><div class="handoff">` +
      `<div class="ver"><h3>${L("v0.10 에서 일하던 중", "Working in v0.10")}</h3>${rows}</div>` +
      `<div class="arrow">→</div>` +
      `<div class="ver"><h3>${L("v0.11 로 업데이트한 뒤", "After updating to v0.11")}</h3>${rows}</div></div>`;
  } else if (sc.kind === "list") {
    el.innerHTML = brand + `<div class="cap"><h1>${sc.h}</h1></div><ul>${sc.items.map(([a, b]) => `<li><b>✓</b><span>${a}<small>${b}</small></span></li>`).join("")}</ul>`;
  } else if (sc.kind === "pair") {
    el.innerHTML = brand + `<div class="cap"><h1>${sc.h}</h1><p>${sc.s}</p></div><div class="tag" style="left:140px">${sc.la}</div><div class="tag" style="left:980px">${sc.lb}</div><div class="card a"></div><div class="card b"></div>`;
    sc.imgA = loadImg(sc.a); sc.imgB = loadImg(sc.b);
    el.querySelector(".card.a").appendChild(sc.imgA); el.querySelector(".card.b").appendChild(sc.imgB);
  } else {
    el.innerHTML = brand + `<div class="cap"><h1>${sc.h}</h1><p>${sc.s}</p></div><div class="card"></div>`;
    sc.im = loadImg(sc.img);
    el.querySelector(".card").appendChild(sc.im);
  }
  // 시작·끝 화면 맨 위에 부기(docs/buki.svg 를 make_promo.sh 가 옆에 둔다)
  if (sc.kind === "title" || sc.kind === "outro") {
    const b = loadImg("buki.svg");
    b.className = "buki";
    el.querySelector(".big").prepend(b);
  }
  sc.el = el;
  sc.capEl = el.querySelector(".cap");
  root.appendChild(el);
}
if (!pending) window.ready = true;

window.render = (t) => {
  for (const sc of S) {
    const [a, b] = sc.t;
    const first = sc === S[0], last = sc === S[S.length - 1];
    // 앞뒤 장면과 FADE 동안 겹쳐 서서히 바뀐다
    const fin = first ? 1 : ease((t - a + FADE / 2) / FADE);
    const fout = last ? 1 : 1 - ease((t - b + FADE / 2) / FADE);
    const op = Math.max(0, Math.min(fin, fout));
    sc.el.style.opacity = op;
    sc.el.style.display = op > 0 ? "block" : "none";
    if (op <= 0) continue;
    const u = (t - a) / (b - a);
    if (sc.capEl) {
      const k = ease((t - a) / 0.55);
      sc.capEl.style.transform = `translateY(${lerp(26, 0, k)}px)`;
      sc.capEl.style.opacity = k;
    }
    if (sc.kind === "note" || sc.kind === "list") {
      const items = sc.el.querySelectorAll(".ver, li");
      items.forEach((it, i) => {
        const k = ease((t - a - 0.25 - i * 0.18) / 0.5);
        it.style.opacity = k;
        it.style.transform = `translateY(${lerp(24, 0, k)}px)`;
      });
      continue;
    }
    if (sc.kind === "title" || sc.kind === "outro") {
      const k = ease((t - a) / 0.8);
      sc.el.firstElementChild.style.transform = `scale(${lerp(0.94, 1, k)})`;
      continue;
    }
    if (sc.kind === "pair") {
      const iw = sc.imgA.naturalWidth, ih = sc.imgA.naturalHeight;
      place(sc.imgA, sc.region, iw, ih, 760, 740);
      place(sc.imgB, sc.region, iw, ih, 760, 740);
      continue;
    }
    const [iw, ih] = [sc.im.naturalWidth, sc.im.naturalHeight];
    const k = ease((u - 0.12) / 0.62);
    const r = sc.from.map((v, i) => lerp(v, sc.to[i], k));
    if (sc.wide) {
      const card = sc.el.querySelector(".card");
      const h = Math.round((CW * ih) / iw);
      card.style.height = `${h}px`;
      card.style.top = `${300 + Math.max(0, (740 - h) / 2)}px`;
      place(sc.im, r, iw, ih, CW, h);
    } else place(sc.im, r, iw, ih);
  }
};
</script></body></html>
